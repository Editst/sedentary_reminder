<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>久坐提醒</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="eyebrow">久坐提醒</p>
        <h1 id="mode">正在读取状态</h1>
        <p id="detail" class="detail">稍等片刻，正在同步当前计时与提醒状态。</p>

        <div class="meter">
          <span id="remaining">--:--</span>
          <small id="remaining-label">剩余时间</small>
        </div>

        <div class="summary">
          <span id="cycle">循环信息加载中</span>
          <span id="window-state">提醒窗口状态加载中</span>
        </div>

        <div class="actions">
          <button id="context-action" class="context-action hidden">立即开始休息</button>
          <button id="pause">暂停提醒</button>
          <button id="resume">恢复提醒</button>
          <button id="test">测试提醒</button>
          <button id="open-options">打开设置页</button>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
