<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>久坐提醒</title>
    <link rel="stylesheet" href="./notification.css" />
  </head>
  <body>
    <main class="frame">
      <section class="reminder">
        <p class="eyebrow">久坐提醒</p>
        <h1 id="title">提醒加载中</h1>
        <p id="message" class="message">正在同步提醒内容，请稍候。</p>

        <div class="countdown-card">
          <div>
            <span class="countdown-label">自动关闭倒计时</span>
            <strong id="countdown">00:00</strong>
          </div>
          <p id="countdown-copy" class="countdown-copy">提醒页会在倒计时结束后自动关闭。</p>
          <div class="progress-track">
            <div id="progress" class="progress-bar"></div>
          </div>
        </div>

        <div class="actions">
          <button id="primary-action" class="primary-action">开始休息</button>
          <div class="secondary-actions">
            <button id="snooze-5">延后 5 分钟</button>
            <button id="snooze-10">延后 10 分钟</button>
            <button id="skip">暂不处理</button>
          </div>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./notification.js"></script>
  </body>
</html>
