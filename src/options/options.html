<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>久坐提醒设置</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <header class="hero">
          <p class="eyebrow">久坐提醒</p>
          <h1>提醒与休息设置</h1>
          <p class="subtle">在这里统一配置专注时长、休息节奏、生效时段、提醒文案和提醒页关闭时间。</p>
        </header>

        <form id="settings-form" class="form">
          <label class="toggle-row">
            <span>
              <strong>启用提醒</strong>
              <small>关闭后将停止调度、通知和提醒页。</small>
            </span>
            <input id="enabled" type="checkbox" />
          </label>

          <fieldset class="schedule-section">
            <legend><strong>生效时间范围</strong></legend>
            <label class="toggle-row schedule-toggle">
              <span>
                <strong>启用时段限制</strong>
                <small>开启后仅在指定时段与星期内提醒；非生效时段静默休眠。</small>
              </span>
              <input id="scheduleEnabled" type="checkbox" />
            </label>

            <div id="schedule-details" class="schedule-details">
              <div class="grid two-columns">
                <label>
                  <span>开始时间</span>
                  <input id="scheduleStartTime" type="time" />
                </label>
                <label>
                  <span>结束时间</span>
                  <input id="scheduleEndTime" type="time" />
                </label>
              </div>

              <div class="days-group">
                <span class="days-label">生效星期</span>
                <div class="days-checkboxes">
                  <label class="day-chip"><input type="checkbox" name="scheduleDay" value="1" /><span>周一</span></label>
                  <label class="day-chip"><input type="checkbox" name="scheduleDay" value="2" /><span>周二</span></label>
                  <label class="day-chip"><input type="checkbox" name="scheduleDay" value="3" /><span>周三</span></label>
                  <label class="day-chip"><input type="checkbox" name="scheduleDay" value="4" /><span>周四</span></label>
                  <label class="day-chip"><input type="checkbox" name="scheduleDay" value="5" /><span>周五</span></label>
                  <label class="day-chip"><input type="checkbox" name="scheduleDay" value="6" /><span>周六</span></label>
                  <label class="day-chip"><input type="checkbox" name="scheduleDay" value="0" /><span>周日</span></label>
                </div>
              </div>
            </div>
          </fieldset>

          <div class="grid two-columns">
            <label>
              <span>专注时长（分钟）</span>
              <input id="workMinutes" type="number" min="1" max="240" />
            </label>
            <label>
              <span>短休息（分钟）</span>
              <input id="shortBreakMinutes" type="number" min="1" max="60" />
            </label>
            <label>
              <span>长休息（分钟）</span>
              <input id="longBreakMinutes" type="number" min="1" max="120" />
            </label>
            <label>
              <span>长休息频率</span>
              <input id="longBreakEvery" type="number" min="1" max="12" />
            </label>
            <label>
              <span>提醒页自动关闭（秒）</span>
              <input id="reminderAutoCloseSeconds" type="number" min="5" max="300" />
            </label>
          </div>

          <label>
            <span>延后选项（分钟，逗号分隔）</span>
            <input id="snoozeMinutesOptions" type="text" placeholder="5,10" />
          </label>
          <label>
            <span>提醒标题</span>
            <input id="reminderTitle" type="text" maxlength="80" />
          </label>
          <label>
            <span>提醒内容</span>
            <textarea id="reminderBody" rows="4" maxlength="200"></textarea>
          </label>

          <div class="actions">
            <button id="save" type="submit">保存并立即生效</button>
            <button id="test" type="button">发送测试提醒</button>
            <button id="reset" type="button">恢复默认设置</button>
          </div>
        </form>

        <p id="status" class="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./options.js"></script>
  </body>
</html>
